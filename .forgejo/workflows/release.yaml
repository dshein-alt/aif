name: Release

# A release tag (v1.2.3, v1.2.3-rc1, ...) builds aif-connect for linux/amd64 and publishes the binary
# plus SHA256SUMS to the repository owner's generic package registry: package aif-connect, version =
# the tag. Nothing else publishes. The publish token is the PKG_PUBLISH_TOKEN secret set on the
# repository. Generic packages of a public repository download without a token:
#   curl -O $GITHUB_SERVER_URL/api/packages/<owner>/generic/aif-connect/<tag>/aif-connect-linux-amd64
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # Re-run the whole path against a tag that is already out, to try the
  # pipeline itself: the registry answers 409 for what it already has.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build'
        required: true
        type: string

jobs:
  release:
    runs-on: als-huge
    container:
      # p11/node, not p11/base: checkout and upload-artifact are node actions.
      image: registry.altlinux.org/p11/node:latest
    env:
      # go.mod names Go 1.26: when p11's golang is older, the go command fetches
      # that toolchain itself (the runner has network).
      GOTOOLCHAIN: auto
      GOFLAGS: -buildvcs=false   # the checkout inside the container is not owned by the build user
    steps:
      # git before checkout, or checkout falls back to a tarball without history.
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y golang git-core ca-certificates

      - uses: actions/checkout@v4
        with:
          # A manual run starts from a branch: all tags are needed to find the one named.
          fetch-depth: 0

      # A tag push carries the tag in the ref, a manual run names it. The
      # branch is local and throwaway, it only keeps git off a detached HEAD.
      - name: Pick the tag
        run: |
          git config --global --add safe.directory "$PWD"
          tag="${{ github.event.inputs.tag }}"
          tag=${tag:-${GITHUB_REF#refs/tags/}}
          # A manual run picks the workflow from a branch, so the ref names no
          # tag: without the input there is nothing to build.
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null || {
            echo "'$tag' is not a tag in this repository" >&2
            exit 1
          }
          echo "building $tag"
          git checkout -qB ci-build "$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Build
        run: GIT_SHA=$(git rev-parse --short "$TAG") sh scripts/dist.sh linux/amd64

      # The binary stays reachable from the run even when the upload fails.
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: aif-connect
          path: dist/*

      # The credentials belong to a user, the registry to the repository owner:
      # set the PACKAGES_USER variable when the token is not the owner's own.
      - name: Upload to the generic package registry
        env:
          REGISTRY_USER: ${{ vars.PACKAGES_USER }}
          TOKEN: ${{ secrets.PKG_PUBLISH_TOKEN }}
        run: |
          registry="$GITHUB_SERVER_URL/api/packages/$GITHUB_REPOSITORY_OWNER/generic/aif-connect/$TAG"
          user="${REGISTRY_USER:-$GITHUB_REPOSITORY_OWNER}"
          echo "uploading to $registry as $user"
          for f in dist/aif-connect-linux-amd64 dist/SHA256SUMS; do
            code=$(curl -sS -o resp.txt -w '%{http_code}' \
              --user "$user:$TOKEN" --upload-file "$f" "$registry/$(basename "$f")")
            case $code in
            201) echo "uploaded $(basename "$f")" ;;
            409) echo "$(basename "$f") is already published" ;;
            *)
              echo "uploading $(basename "$f") answered $code: $(cat resp.txt)" >&2
              exit 1
              ;;
            esac
          done
