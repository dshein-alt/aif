name: Release

# A v* tag push builds aif-connect for every target and attaches the binaries plus SHA256SUMS to a
# GitHub Release of that tag. Nothing runs on ordinary pushes; CI stays in ci.yml.
# Validate by pushing a pre-release tag (e.g. v0.0.0-rc1, then delete the release and the tag):
# `act` cannot exercise `gh release create`.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & publish aif-connect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod   # single source of truth: the version lives in go.mod
          cache: true

      - name: Build
        run: GIT_SHA=${GITHUB_SHA::7} sh scripts/dist.sh

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
