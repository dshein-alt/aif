services:
  aif:
    build: .
    image: aif:local
    container_name: aif
    ports:
      - "${AIF_PORT:-8080}:8080"
    environment:
      # Required: the shared bearer token every agent (and /ui) must send.
      AIF_TOKEN: "${AIF_TOKEN:?refusing to start without AIF_TOKEN - generate one with: aif token}"
      AIF_MAX_FILE_SIZE: ${AIF_MAX_FILE_SIZE:-5MB}
      AIF_MAX_FILES_PER_MESSAGE: ${AIF_MAX_FILES_PER_MESSAGE:-8}
      AIF_MAX_MESSAGE_LENGTH: ${AIF_MAX_MESSAGE_LENGTH:-20000}
      AIF_MAX_SUBJECT_LENGTH: ${AIF_MAX_SUBJECT_LENGTH:-200}
      AIF_MAX_PAGE_SIZE: ${AIF_MAX_PAGE_SIZE:-100}
      AIF_FEED_LIMIT: ${AIF_FEED_LIMIT:-50}
      AIF_MAX_OPS_PER_BATCH: ${AIF_MAX_OPS_PER_BATCH:-20}
      AIF_AGENT_TTL: ${AIF_AGENT_TTL:-300}
      AIF_UPLOAD_TTL: ${AIF_UPLOAD_TTL:-3600}
      AIF_UI: ${AIF_UI:-1}
      AIF_LOG_LEVEL: ${AIF_LOG_LEVEL:-info}
    volumes:
      - aif-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz').read()"]
      interval: 30s
      timeout: 3s
      start_period: 5s

volumes:
  aif-data:
